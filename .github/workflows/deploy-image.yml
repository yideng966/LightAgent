# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Create and publish a Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yideng966/lightagent
  DOCKERHUB_IMAGE: yideng966/lightagent

jobs:
  build-and-push-image:
    if: github.repository == 'yideng966/LightAgent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            latest_tag: latest
            version_suffix: ""
            capability_packs: ""
          - variant: skills-full
            latest_tag: skills-full
            version_suffix: -skills-full
            capability_packs: office,media,browser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive release version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(tr -d '\r\n' < cli/VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp release version
        shell: bash
        run: python scripts/stamp_release_version.py "${{ steps.ver.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.latest_tag }},enable=true
            type=ref,event=tag,suffix=${{ matrix.version_suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./docker/Dockerfile.latest
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SKILL_CAPABILITY_PACKS=${{ matrix.capability_packs }}

      - uses: actions/delete-package-versions@v4
        if: matrix.variant == 'base'
        with:
          package-name: 'lightagent'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
