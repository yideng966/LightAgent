name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release notes
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/${TAG}.md"
          python scripts/validate_release_notes.py --tag "$TAG" "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          title="LightAgent ${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$VERSION" == *-* ]]; then
              gh release edit "$TAG" \
                --title "$title" \
                --notes-file "$NOTES_FILE" \
                --prerelease
            else
              gh release edit "$TAG" \
                --title "$title" \
                --notes-file "$NOTES_FILE" \
                --latest
            fi
          else
            create_args=(--verify-tag --title "$title" --notes-file "$NOTES_FILE")
            if [[ "$VERSION" == *-* ]]; then
              create_args+=(--prerelease --latest=false)
            else
              create_args+=(--latest)
            fi
            gh release create "$TAG" "${create_args[@]}"
          fi
